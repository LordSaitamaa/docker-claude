name: claude-code

# Network topology:
#   claude-code ──[claude-internal (no internet)]──► squid-proxy ──[claude-external]──► Internet
#                                                                   (whitelisted domains only)

services:

  claude:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Linux: set to host uid/gid (id -u && id -g) | Windows/macOS: keep defaults
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    container_name: claude-code
    hostname: claude-code

    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      HTTP_PROXY:  "http://squid:3128"
      HTTPS_PROXY: "http://squid:3128"
      http_proxy:  "http://squid:3128"
      https_proxy: "http://squid:3128"
      NO_PROXY:    "localhost,127.0.0.1"
      no_proxy:    "localhost,127.0.0.1"
      PROXY_HOST: squid
      PROXY_PORT: "3128"
      CLAUDE_YOLO: ${CLAUDE_YOLO:-true}

    volumes:
      # Claude config (auth tokens, preferences)
      - type: bind       
        source: ${CLAUDE_CONFIG_PATH:-~/.claude}
        target: /home/users/claude/.claude
        read_only: false

      - type: bind
        source: ${CLAUDE_CONFIG_PATH:-~/.claude.json}
        target: /home/users/claude/.claude.json
        read_only: false

      # Repository to work on
      - type: bind
        source: ${REPO_PATH:-./workspace}
        target: /home/users/claude/workspace
        read_only: false

    networks:
      - claude-internal

    depends_on:
      squid:
        condition: service_healthy

    # Security hardening
    cap_drop:
      - ALL
    cap_add:
      - CHOWN    # entrypoint permission fix
      - SETUID   # su-exec privilege drop
      - SETGID   # su-exec group switch
    security_opt:
      - no-new-privileges:true
      - seccomp:./security/seccomp.json

    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=512m,nosuid
      - /home/users/claude/.config:mode=700,size=64m,nosuid
      - /home/users/claude/.cache:mode=700,size=128m,noexec,nosuid
      - /run:mode=755,size=32m,noexec,nosuid

    privileged: false
    pid: ""

    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          memory: 256M

    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"


  squid:
    build:
      context: ./proxy
      dockerfile: Dockerfile
    container_name: claude-squid
    hostname: squid

    environment:
      EXTRA_DOMAINS: ${EXTRA_DOMAINS:-}

    volumes:
      - type: bind
        source: ./proxy/squid.conf.template
        target: /etc/squid/squid.conf.template
        read_only: true

    networks:
      - claude-internal
      - claude-external

    cap_drop:
      - ALL
    cap_add:
      - CHOWN           # entrypoint chown for squid dirs
      - NET_BIND_SERVICE
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true

    privileged: false

    healthcheck:
      test: ["CMD-SHELL", "squidclient -h localhost -p 3128 mgr:info 2>/dev/null | grep -q 'Squid Object Cache' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"


networks:
  claude-internal:
    driver: bridge
    internal: true    # no internet access
    ipam:
      config:
        - subnet: 172.28.0.0/24

  claude-external:
    driver: bridge    # only squid has access
    ipam:
      config:
        - subnet: 172.29.0.0/24
